/* noir lighting pass: everything is drawn fully lit first, then darkened in hard bands by a light map */
/* lighting: each pixel gets a light level and a light colour; levels are stepped (with a little ordered
   dither at the edges) so it stays pixel art, shadows lean cold, and colour is pulled back a touch */
function noirShade2(x,F,amb=[.7,.8,1.05],sat=.82){const im=x.getImageData(0,0,SW,SH2),d=im.data;
 for(let Y=0;Y<SH2;Y++)for(let X=0;X<SW;X++){let r=F(X,Y);if(typeof r=='number')r=[r,1,1,1];const q=Math.max(.06,Math.min(1,Math.floor((r[0]+(BY[(X&3)+(Y&3)*4]-7.5)/16*.09)*10)/10)),i=(Y*SW+X)*4;
  let R0=d[i],G0=d[i+1],B0=d[i+2];const lum=.3*R0+.59*G0+.11*B0;R0=lum+(R0-lum)*sat;G0=lum+(G0-lum)*sat;B0=lum+(B0-lum)*sat;
  d[i]=Math.min(255,R0*q*(r[1]*q+amb[0]*(1-q)));d[i+1]=Math.min(255,G0*q*(r[2]*q+amb[1]*(1-q)));d[i+2]=Math.min(255,B0*q*(r[3]*q+amb[2]*(1-q)))}x.putImageData(im,0,0)}
function noirShade(x,Lf,tint=[.92,.96,1.06]){return noirShade2(x,(X,Y)=>Math.min(1,Lf(X,Y)*1.05),[tint[0]*.8,tint[1]*.85,tint[2]*.95],.88)}
function noirShadeOld(x,Lf,tint=[.92,.96,1.06]){const im=x.getImageData(0,0,SW,SH2),d=im.data;
 for(let Y=0;Y<SH2;Y++)for(let X=0;X<SW;X++){const v=Lf(X,Y)+(BY[(X&3)+(Y&3)*4]-7.5)/16*.1,f=v>.78?1:v>.56?.68:v>.36?.44:v>.18?.25:.11,i=(Y*SW+X)*4;
  if(f<1){d[i]=d[i]*f*tint[0];d[i+1]=d[i+1]*f*tint[1];d[i+2]=Math.min(255,d[i+2]*f*tint[2])}}x.putImageData(im,0,0)}
function rays(x,cx,y0,y1,w0,k,col,a){x.save();for(const[s,al]of[[1,a],[.55,a*1.6]]){x.globalAlpha=al;x.fillStyle=col;for(let Y=y0;Y<y1;Y++){const hw=(w0+(Y-y0)*k)*s;x.fillRect(Math.round(cx-hw),Y,Math.round(hw*2),1)}}x.restore()}

DLG.captain={start:()=>{const f=!FLAGS.capSeen;FLAGS.capSeen=1;return f?'first':'again'},nodes:{
 first:{who:'CAPTAIN',say:"You knocked. Nobody knocks on this door unless they want something. What do you want, detective?",opts:()=>capMenu()},
 again:{who:'CAPTAIN',say:()=>(FLAGS.lates||0)>=2?"You again. You find your way in here easier than you find your way in at half past eight.":"Something else? I've got the Commissioner on line two.",opts:()=>capMenu()},
 chk:{who:'CAPTAIN',say:"Then check in with your desk. That pile isn't going to stamp itself.",opts:()=>[{t:'Yes, Captain.',go:'squad'}]},
 bc:{who:'CAPTAIN',say:"Every merchant from Yonkers to Levittown is papering his window with them. Close cases. Bring me names, detective, not hunches.",opts:()=>[{t:'Yes, Captain.',go:'squad'}]}}};
const capMenu=()=>[{t:'Just checking in, Captain.',go:'chk',min:2},{t:'About these bounced cheques...',go:'bc',min:5},{t:'Nothing. Sorry, Captain.',go:'squad'}];
DLG.squad={start:()=>'in',nodes:{
 in:{who:()=>SC.inT>WORK?'SGT. KESSLER':'',act:()=>{if(FLAGS.justIn!=null){SC.inT=FLAGS.justIn;delete FLAGS.justIn}},
  say:()=>SC.inT==null?"The squad room. Typewriters, cigarette smoke, the radiator knocking like it wants to be let out.":SC.inT<=WORK?'The time clock downstairs took your card at '+fmtT(SC.inT)+'. Upstairs, the cheques are waiting.':
   FLAGS.lates==1?"Little after half past, detective. Don't worry. I didn't see a thing.":FLAGS.lates==2?"Late again. The captain's been asking where you get to.":"Captain wants a word about your hours. Not today. But soon.",opts:()=>squadMenu()},
 cap:{who:'',say:"Through the frosted glass, the captain is on the telephone. He holds up one finger without looking. Then he turns his back.",opts:()=>squadMenu()},
 coffee:{who:'',say:"The percolator has been on the burner since seven. The coffee tastes like the pot.",opts:()=>squadMenu()},
 rec:{who:'',say:"The records room. Cabinets to the ceiling, every drawer locked. A card on the first one, in neat handwriting: BACK AT 2.",opts:()=>squadMenu()}}};
const squadMenu=()=>[];
/* Kessler: one conversation a day. Day 1-3 are written; from day 4 he has a line about the coffee. */
Object.assign(DLG.squad.nodes,{
 k1:{who:'SGT. KESSLER',say:"So they gave you the paper beat. Bounced cheques. Better you than me.",opts:()=>[{t:'Somebody has to do it.',go:'k1a',min:2},{t:'Who had it before me?',go:'k1b',min:2}]},
 k1a:{who:'SGT. KESSLER',say:"Last fella at that desk asked for a transfer to Traffic. Said at least in Traffic the crooks stand still.",opts:()=>[]},
 k1b:{who:'SGT. KESSLER',say:"Donnelly. Retired in October, moved to Florida. Sends the captain an orange every Christmas. One orange.",opts:()=>[]},
 k2:{who:'SGT. KESSLER',say:"Captain had two calls before nine. Same fella both times. Some banker from Island Mercantile.",opts:()=>[{t:'What did he want?',go:'k2a',min:2},{t:'Not my business.',go:'k2b',min:1}]},
 k2a:{who:'SGT. KESSLER',say:"Didn't say. Captain shut his door. Captain never shuts his door.",opts:()=>[]},
 k2b:{who:'SGT. KESSLER',say:"That's the spirit. You'll live longer that way.",opts:()=>[]},

let AC=null;const SFXB={},PEND={};
function sfxInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();for(const k in SFXD){const bin=atob(SFXD[k]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 AC.decodeAudioData(u.buffer,b=>{SFXB[k]=b;if(PEND[k]&&performance.now()-PEND[k]<700){delete PEND[k];sfx(k)}},()=>{})}}catch(e){AC=null}}
const SFXCD={grabCard:350,dropCard:350},SFXL={};
function sfx(k,vol=.8){try{if(!AC)return;if(SFXCD[k]&&SFXL[k]&&performance.now()-SFXL[k]<SFXCD[k])return;if(AC.state=='suspended')AC.resume();const b=SFXB[k];if(!b){PEND[k]=performance.now();return}SFXL[k]=performance.now();const s=AC.createBufferSource(),gn=AC.createGain();gn.gain.value=vol;s.buffer=b;s.connect(gn);gn.connect(AC.destination);s.start()}catch(e){}}
addEventListener('mousedown',sfxInit,true);addEventListener('keydown',sfxInit,true);
const pickTool=i=>{tool=tool==i?-1:i;if(tool>=0)sfx(['light','uv','loupe'][i])};
/* whole-number pixel scaling so every game pixel is the same size on screen */
function fit(){const d=devicePixelRatio||1,k=Math.min(innerWidth/W,innerHeight/H),s=k*d>=1?Math.floor(k*d)/d:k;C.style.width=W*s+'px';C.style.height=H*s+'px'}
C.addEventListener('wheel',e=>{if(st!='lab')return;const L3=day[ix].lab3;if(L3&&L3.done){if(!L3.wt||performance.now()-L3.wt>60){L3.wt=performance.now();const want=L3.fs+Math.sign(e.deltaY),v=Math.max(0,Math.min(FSTEPS,want));if(want!=v)L3.bump={t:performance.now(),d:want>v?1:-1};L3.fs=v}e.preventDefault()}},{passive:false});
